[package]
name = "poke-engine"
version = "0.0.48"
authors = ["pmariglia <pmariglia@github.com>"]
edition = "2018"
license-file = "LICENSE"
description = "A Pokemon battle engine that can be used to search through the state space of a Pokemon battle."

[lib]
name = "poke_engine"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "poke-engine"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "data/benchmark.rs"

[[bin]]
name = "bench_gi"
path = "data/bench_gi.rs"

[profile.release]
debug = 1

[dependencies]
dashmap = "6.1.0"
clap = { version = "4.5.4", features = ["derive"] }
rand = "0.9.3"

[features]
remove_low_chance_instructions = []
# All generations (1..=9) are served by a single build and selected at runtime, so
# there are no per-generation features. Gens 4-9 come from the const-generic `genx`
# engine; gens 1-3 have their own engine implementations. `terastallization` mechanics
# are `GEN >= 9` behavior.
champions = []
bss = ["champions"]

default = []

[workspace]
members = [
    "poke-engine-py"
]
