[package]
name = "poke-engine"
version = "0.0.48"
authors = ["pmariglia <pmariglia@github.com>"]
edition = "2018"
license-file = "LICENSE"
description = "A Pokemon battle engine that can be used to search through the state space of a Pokemon battle."

[lib]
name = "poke_engine"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "poke-engine"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "data/benchmark.rs"

[[bin]]
name = "bench_gi"
path = "data/bench_gi.rs"

[profile.release]
debug = 1

[dependencies]
dashmap = "6.1.0"
clap = { version = "4.5.4", features = ["derive"] }
rand = "0.9.3"

[features]
remove_low_chance_instructions = []
# gen1/gen2/gen3 remain compile-time selected: they are separate engines (src/gen1,
# gen2, gen3) with their own enums and a smaller MoveChoice. They stay mutually
# exclusive with each other and with the genx (const-generic) path.
gen1 = []
gen2 = []
gen3 = []
# genx serves gens 4..=9 at runtime via `const GEN: u8` (monomorphized, zero hot-path
# cost). The old gen4..gen9 and `terastallization` features are gone: pick the gen by
# instantiating the generic entry points with the const, or via the runtime facade.
# `terastallization` mechanics are now `GEN >= 9` behavior.
champions = []
bss = ["champions"]

default = []

[workspace]
members = [
    "poke-engine-py"
]
