[package]
name = "poke_engine"
edition = "2021"
version = "0.0.48"

[lib]
name = "poke_engine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
poke-engine = { path = "../" }

# NOTE (const-generic migration, phase 1): the genx engine no longer has per-gen
# features (gen4..gen9). These Python bindings still call the old monomorphic API and
# need to be updated to the const-generic / runtime-facade API before they will build
# again (see MIGRATION.md). Resolution is unblocked here by depending on no gen feature.
[features]
default = []
