[package]
name = "poke_engine"
edition = "2021"
version = "0.0.48"

[lib]
name = "poke_engine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
poke-engine = { path = "../" }

# The genx engine no longer has per-gen features (gen4..gen9): generations 4-9 come from
# one build and are selected at runtime. The bindings take a `gen` argument instead, so no
# gen feature is needed here (see MIGRATION.md).
[features]
default = []
